  - hiring-for-weaknesses
objectives:
  - Communicate effectively with neurotypical team members
  - Build leadership systems that don't rely on consistent executive function
  - Leverage ADHD strengths (vision, crisis management, creativity) in leadership
  - Handle team conflicts and difficult conversations with emotional regulation challenges
  - Create team communication systems that compensate for working memory
