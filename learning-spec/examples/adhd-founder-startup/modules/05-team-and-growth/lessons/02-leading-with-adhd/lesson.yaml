id: leading-with-adhd
slug: leading-with-adhd
title: "Leading Teams with ADHD"
summary: "Develop leadership skills that leverage your ADHD strengths while managing team communication, consistency, and expectations with executive function challenges."
level: advanced
tags:
  - leadership
  - team-management
  - communication
  - adhd-leadership
estimated_minutes: 50
prerequisites:
