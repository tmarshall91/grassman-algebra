id: task-management-adhd
slug: task-management-adhd
title: "Task Management for ADHD Brains"
summary: "Build task management systems that work with interest-based nervous systems, not against them. Learn to make task lists that don't overwhelm and actually get used."
level: intermediate
tags:
  - task-management
  - productivity
  - systems
